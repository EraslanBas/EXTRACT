[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "extract-screens"
version = "0.1.0.dev0"
description = "Identifiable latent factors from perturbation x context screens"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "torch>=2.0",
    "anndata>=0.9",
    "scanpy>=1.9",
    "tqdm",
]

[project.optional-dependencies]
baselines = ["mofapy2", "h5py"]
dev = ["pytest>=7", "ruff"]

# The distribution is `extract-screens`; the import name is `extract`. An
# unrelated package called `extract` exists on PyPI -- do not install both.
[tool.setuptools.packages.find]
where = ["src"]
include = ["extract*", "perturbseq_sim*", "baselines*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
